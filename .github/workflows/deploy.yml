# Build the site and deploy it to Cloudflare Workers Static Assets.
#
# The node is deliberately not involved. This site is the public face of the
# platform, and a portfolio that 404s while its author reboots a server is worse
# than no portfolio - so it builds in CI and serves from Cloudflare's edge.
#
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN   scoped to Workers Scripts:Edit on this account
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npx astro build

      # Fail the build rather than publish an address. The sanitising pass runs
      # when diagrams are copied in, so this is the check that it actually
      # happened - a silent regression here would publish internal topology.
      - name: Assert no internal addresses in the built output
        run: |
          if grep -rEl '100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+|[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+:[0-9]+|\.ts\.net' dist/; then
            echo "::error::internal address or tailnet hostname found in dist/"
            exit 1
          fi
          echo "clean"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
